<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasteland Character Generator</title>
<style>
  :root { --bg:#16181d; --panel:#22252c; --amber:#f0be28; --ink:#e8e2cf; --muted:#9a9a9a; --green:#7cd67c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:sans-serif; }
  body { display:flex; flex-direction:column; max-width:100vw; overflow-x:hidden; }
  #info { overflow-wrap:anywhere; }
  .bar button { min-width:0; }
  header { padding:14px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:18px; letter-spacing:2px; color:var(--amber); font-weight:800; text-transform:uppercase; }
  .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  #gen { margin:10px 16px 6px; padding:18px 12px; border:none; border-radius:14px; background:var(--amber);
         color:#1a1a1a; font-size:19px; font-weight:900; letter-spacing:1px; box-shadow:0 4px 0 #a07c10; }
  #gen:active { transform:translateY(3px); box-shadow:0 1px 0 #a07c10; }
  #gen:disabled { opacity:.6; }
  #info { margin:4px 16px; min-height:40px; font-size:13px; line-height:1.35; }
  #info b { color:var(--amber); }
  #info .q { color:var(--muted); font-style:italic; }
  #view { flex:1; overflow:auto; margin:6px 10px; border-radius:10px; background:#0d0e11; -webkit-overflow-scrolling:touch; }
  #view img { display:block; width:100%; height:auto; }
  #view.zoom img { width:260%; max-width:none; }
  #view .empty { padding:40px 20px; text-align:center; color:var(--muted); font-size:14px; }
  .bar { display:flex; gap:8px; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); }
  .bar button { flex:1; padding:13px 6px; border-radius:10px; border:1px solid #3a3e47; background:var(--panel);
                color:var(--ink); font-size:14px; font-weight:700; }
  .bar button:disabled { opacity:.4; }
  #toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#000c; color:var(--green);
           padding:10px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; text-align:center; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>&#9762; Wasteland Recruit &#9762;</h1>
  <div class="sub">Random level-1 characters for Fallout 2d20</div>
</header>
<button id="gen">GENERATE CHARACTER</button>
<div id="info">Tap the button to roll a new wastelander.</div>
<div id="view"><div class="empty">Your filled character sheet will appear here.<br><br>Tap the sheet to zoom in.</div></div>
<div class="bar">
  <button id="save" disabled>&#128190; Save</button>
  <button id="share" disabled>&#128228; Share</button>
</div>
<div id="toast"></div>

<script charset="utf-8" src="sheet_data.js"></script>
<script charset="utf-8" src="gamedata.js"></script>
<script charset="utf-8" src="generator.js"></script>
<script charset="utf-8" src="render.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let current = null, dataUrl = null;

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600);
  }
  const fileName = c => (c.name.replace(/[^A-Za-z0-9 _-]+/g, "").trim().replace(/ /g, "_") || "character") + "_" + Date.now() + ".png";
  const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  $("gen").onclick = async () => {
    $("gen").disabled = true;
    try {
      current = generate();
      const cv = await renderCharacter(current);
      dataUrl = cv.toDataURL("image/png");
      const view = $("view");
      view.innerHTML = "";
      const img = new Image(); img.src = dataUrl; img.alt = "Filled character sheet";
      img.onclick = () => view.classList.toggle("zoom");
      view.appendChild(img);
      view.scrollTop = 0; view.scrollLeft = 0;
      $("info").innerHTML = `<b>${esc(current.name)}</b> &mdash; ${esc(current.origin)} (${esc(current.pack)}), ${esc(current.archetype)}<br><span class="q">${esc(current.gimmick_short)}</span>`;
      $("save").disabled = $("share").disabled = false;
    } catch (e) {
      $("info").textContent = "Something went wrong: " + e;
    }
    $("gen").disabled = false;
  };

  $("save").onclick = () => {
    if (!dataUrl) return;
    if (window.AndroidBridge) {
      const r = AndroidBridge.saveImage(dataUrl, fileName(current));
      toast(r.startsWith("ERROR") ? r : "Saved to Pictures/Fallout Characters");
    } else {
      const a = document.createElement("a"); a.href = dataUrl; a.download = fileName(current); a.click();
    }
  };
  $("share").onclick = () => {
    if (!dataUrl) return;
    if (window.AndroidBridge) {
      const r = AndroidBridge.shareImage(dataUrl, fileName(current), current.name);
      if (r.startsWith("ERROR")) toast(r);
    } else toast("Sharing works in the Android app.");
  };
</script>
</body>
</html>
