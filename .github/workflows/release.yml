# Builds WastelandRecruit.exe and WastelandRecruit.apk and attaches them to a GitHub Release.
#
# How to release: on GitHub, Releases -> "Draft a new release" -> new tag like v4.1.0 -> Publish.
# This workflow then builds both files with that version number and adds them to the release,
# and the installed apps offer the update the next time they are opened.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_B64       contents of release.jks.base64.txt
#   ANDROID_KEYSTORE_PASSWORD  the KS_PASS value from signing.properties
name: Build release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v4.1.0"
        required: true

permissions:
  contents: write # needed to attach files to the release

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set the app version from the tag
        shell: bash
        run: |
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v4.1.0 (got $TAG)"; exit 1; }
          sed -i "s/^const APP_VERSION = .*/const APP_VERSION = \"$V\";/" web/version.js
          grep APP_VERSION web/version.js
      - name: Install build tools
        run: python -m pip install pyinstaller pywebview
      - name: Build the exe
        working-directory: FalloutCharGen
        run: python -m PyInstaller --noconfirm --onefile --windowed --name WastelandRecruit --icon assets/app.ico --add-data "../web;web" desktop_app.py
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" FalloutCharGen/dist/WastelandRecruit.exe --clobber --repo "$GITHUB_REPOSITORY"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Set the app version from the tag
        run: |
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v4.1.0 (got $TAG)"; exit 1; }
          sed -i "s/^const APP_VERSION = .*/const APP_VERSION = \"$V\";/" web/version.js
      - name: Build and sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          WR_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$WR_KS_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          WR_KEYSTORE="$RUNNER_TEMP/release.jks" bash FalloutCharGenAndroid/build_apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" FalloutCharGenAndroid/WastelandRecruit.apk --clobber --repo "$GITHUB_REPOSITORY"
